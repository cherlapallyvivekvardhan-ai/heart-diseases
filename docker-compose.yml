version: '3.8'

services:
  web-ui:
    build: .
    container_name: cardioscan_streamlit_ui
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    restart: unless-stopped

  api-service:
    build: .
    container_name: cardioscan_fastapi_service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    command: ["uvicorn", "api_app:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
